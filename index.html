<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活偏差値診断">
<title>就活偏差値診断</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
  color: #333;
}
.container {
  max-width: 820px;
  margin: 40px auto;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  padding: 32px 36px;
}
h1 {
  text-align: center;
  color: #4a4a7a;
  margin-bottom: 8px;
  font-size: 28px;
}
.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 24px;
  font-size: 14px;
}
.nav { text-align: center; margin-bottom: 20px; }
.nav a {
  color: #667eea;
  text-decoration: none;
  font-size: 13px;
  padding: 4px 12px;
  border: 1px solid #d0d6ff;
  border-radius: 12px;
}
.nav a:hover { background: #f6f8ff; }
.nav a + a { margin-left: 6px; }
.form-group { margin-bottom: 18px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  color: #4a4a7a;
  font-size: 13px;
}
select, input[type="text"], input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #e0e0e8;
  border-radius: 8px;
  font-size: 14px;
  background: #fafaff;
  transition: border-color 0.2s;
  font-family: inherit;
}
select:focus, input:focus { outline: none; border-color: #667eea; }
.hint { font-size: 11px; color: #999; margin-top: 4px; }
.suggest {
  position: relative;
  margin-top: 6px;
  max-height: 220px;
  overflow-y: auto;
  border: 2px solid #667eea;
  border-radius: 10px;
  background: #fff;
  display: none;
  z-index: 10;
  box-shadow: 0 6px 20px rgba(102,126,234,0.18);
}
.suggest-item {
  padding: 12px 14px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #2c2c3e;
  border-bottom: 1px solid #eef0fb;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  transition: background 0.12s;
}
.suggest-item:last-child { border-bottom: none; }
.suggest-item:hover, .suggest-item:active { background: #eef1ff; }
.suggest-item .hen {
  color: #fff;
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.checkbox-grid label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: #fafaff;
  border: 2px solid #e0e0e8;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  font-size: 13px;
  transition: all 0.15s;
}
.checkbox-grid label:has(input:checked) {
  background: #eef1ff;
  border-color: #667eea;
  color: #4a4a7a;
}
.checkbox-grid input { margin: 0; }
button.primary {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.15s;
}
button.primary:hover { opacity: 0.9; }
.result {
  margin-top: 28px;
  display: none;
}
.result.show { display: block; }
.score-card {
  padding: 28px;
  background: linear-gradient(135deg, #f6f8ff 0%, #eef1ff 100%);
  border-radius: 12px;
  border: 2px solid #d0d6ff;
  text-align: center;
  margin-bottom: 20px;
}
.score-label {
  font-size: 13px;
  color: #888;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.score-value {
  font-size: 64px;
  font-weight: 700;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
}
.tier-badge {
  display: inline-block;
  padding: 6px 14px;
  margin-top: 10px;
  background: #fff;
  border: 2px solid #764ba2;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  color: #764ba2;
}
.breakdown {
  margin-top: 16px;
  padding: 14px;
  background: #fff;
  border-radius: 8px;
  font-size: 12px;
  text-align: left;
  max-height: 200px;
  overflow-y: auto;
}
.breakdown-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px dashed #f0f0f5;
}
.breakdown-item .val.pos { color: #2e7d32; font-weight: 600; }
.breakdown-item .val.neg { color: #c62828; font-weight: 600; }
.breakdown-item .val.base { color: #1565c0; font-weight: 600; }
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: #4a4a7a;
  margin: 20px 0 10px 0;
  padding: 8px 12px;
  border-left: 4px solid #667eea;
  background: #f6f8ff;
  border-radius: 4px;
}
.section-title .cat-note { font-size: 11px; color: #888; font-weight: 400; margin-left: 8px; }
.match-group { margin-bottom: 10px; padding: 10px; background: #fafaff; border-radius: 8px; }
.match-hensachi { font-weight: 700; color: #667eea; font-size: 13px; margin-bottom: 4px; }
.match-companies { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  padding: 3px 8px;
  background: #fff;
  border-radius: 5px;
  font-size: 12px;
  border: 1px solid #d0d6ff;
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { background: #eef1ff; border-color: #667eea; }
.arrow-up { color: #e65100; font-weight: 700; margin-left: 1px; }
.arrow-down { color: #1976d2; font-weight: 700; margin-left: 1px; }
.cat-余裕 { color: #2e7d32; }
.cat-実力相応 { color: #1565c0; }
.cat-挑戦 { color: #e65100; }
.cat-高望み { color: #c62828; }
.cta-card {
  margin-top: 28px;
  padding: 24px;
  background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
  border: 2px solid #ffb300;
  border-radius: 14px;
  position: relative;
  box-shadow: 0 4px 16px rgba(255,179,0,0.2);
}
.cta-pr {
  position: absolute;
  top: -10px;
  right: 16px;
  background: #ff6f00;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  letter-spacing: 2px;
}
.cta-title {
  font-size: 18px;
  font-weight: 700;
  color: #bf360c;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cta-boost {
  display: inline-block;
  background: #ff6f00;
  color: #fff;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
}
.cta-desc {
  color: #5d4037;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 16px;
}
.cta-desc strong {
  background: linear-gradient(transparent 60%, #fff176 60%);
  font-weight: 700;
  padding: 0 2px;
}
.cta-logos-label {
  font-size: 11px;
  color: #8d6e63;
  margin-bottom: 8px;
  letter-spacing: 1px;
  font-weight: 600;
}
.logos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.logo-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  background: #fff;
  border: 1px solid #ffe0b2;
  border-radius: 8px;
  transition: transform 0.15s;
}
.logo-item:hover { transform: translateY(-2px); }
.logo-item img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.logo-item span {
  font-size: 11px;
  color: #5d4037;
  font-weight: 600;
  text-align: center;
}
.cta-button {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #ff6f00, #e65100);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
.cta-button:hover { opacity: 0.9; }
.cta-note { text-align: center; margin-top: 8px; font-size: 10px; color: #8d6e63; }
@media (max-width: 600px) {
  body { padding: 8px; }
  .container { padding: 18px 14px; margin: 8px auto; border-radius: 12px; }
  h1 { font-size: 22px; }
  .subtitle { font-size: 12px; margin-bottom: 18px; }
  .nav a { display: inline-block; margin: 3px 2px; padding: 7px 12px; font-size: 12px; }
  .nav a + a { margin-left: 2px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; gap: 12px; }
  .checkbox-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .checkbox-grid label { font-size: 12px; padding: 10px 8px; }
  select, input[type="text"], input[type="number"] { font-size: 16px; padding: 11px 12px; }
  button.primary { padding: 15px; font-size: 15px; }
  .score-card { padding: 22px 16px; }
  .score-value { font-size: 48px; }
  .tier-badge { font-size: 12px; padding: 5px 12px; }
  .breakdown { font-size: 11px; padding: 12px; }
  .section-title { font-size: 13px; padding: 7px 10px; }
  .match-group { padding: 8px 10px; }
  .chip { font-size: 12px; padding: 6px 10px; min-height: 30px; display: inline-flex; align-items: center; }
  .cta-card { padding: 18px 14px; }
  .cta-title { font-size: 16px; flex-wrap: wrap; }
  .logos-grid { grid-template-columns: repeat(3, 1fr); }
  .logo-item { padding: 10px 4px; }
  .suggest { max-height: 260px; }
  .suggest-item { padding: 14px 14px; font-size: 15px; }
  .suggest-item .hen { font-size: 13px; padding: 5px 11px; }
}
@media (max-width: 380px) {
  .checkbox-grid { grid-template-columns: 1fr; }
  .logos-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="container">
  <h1>就活偏差値診断</h1>
  <p class="subtitle">プロフィール入力で想定就活偏差値と狙える企業が分かります</p>

  <div class="nav">
    <a href="companies.html">就活偏差値ランキング</a>
  </div>

  <div class="form-row-3">
    <div class="form-group">
      <label>年齢</label>
      <input type="number" id="age" min="18" max="60" value="22">
    </div>
    <div class="form-group">
      <label>性別（任意）</label>
      <select id="gender">
        <option value="">未回答</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="form-group">
      <label>文系 / 理系</label>
      <select id="track">
        <option value="文系">文系</option>
        <option value="理系">理系</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>学歴区分</label>
      <select id="edu">
        <option value="学部卒">学部卒</option>
        <option value="修士卒">修士卒</option>
        <option value="博士卒">博士卒</option>
        <option value="高専卒">高専卒</option>
        <option value="短大卒">短大卒</option>
        <option value="専門卒">専門卒</option>
        <option value="高卒">高卒</option>
      </select>
    </div>
    <div class="form-group">
      <label>学部系統</label>
      <select id="faculty-type">
        <option value="">選択してください</option>
        <option value="法学">法学</option>
        <option value="経済・経営・商">経済・経営・商</option>
        <option value="文学">文学</option>
        <option value="教育">教育</option>
        <option value="社会学">社会学</option>
        <option value="国際・外国語">国際・外国語</option>
        <option value="工学">工学</option>
        <option value="理学">理学</option>
        <option value="情報">情報</option>
        <option value="医・歯・薬">医・歯・薬</option>
        <option value="農学">農学</option>
        <option value="その他">その他</option>
      </select>
    </div>
  </div>

  <div class="form-group" style="position:relative;">
    <label>出身 / 在籍大学</label>
    <input type="text" id="univ" placeholder="例: 東京大学、早稲田、北海道..." autocomplete="off">
    <div class="hint">入力しながら一覧から選択できます。該当がない場合は偏差値50として扱います。</div>
    <div id="univ-suggest" class="suggest"></div>
  </div>

  <div class="form-row-3">
    <div class="form-group">
      <label>英語力（TOEIC目安）</label>
      <select id="toeic">
        <option value="0">未設定 / 受験なし</option>
        <option value="500">〜500</option>
        <option value="600">500〜730</option>
        <option value="730">730〜800 (+0.2)</option>
        <option value="800">800〜900 (+0.5)</option>
        <option value="900">900〜 (+1.0)</option>
      </select>
    </div>
    <div class="form-group">
      <label>留年</label>
      <select id="ryunen">
        <option value="0">なし</option>
        <option value="1">1年 (-1)</option>
        <option value="2">2年 (-2)</option>
        <option value="3">3年以上 (-3)</option>
      </select>
    </div>
    <div class="form-group">
      <label>浪人</label>
      <select id="ronin">
        <option value="0">現役</option>
        <option value="1">1浪 (-0.5)</option>
        <option value="2">2浪 (-1.0)</option>
        <option value="3">3浪以上 (-1.5)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>属性（複数選択可）</label>
    <div class="checkbox-grid">
      <label><input type="checkbox" data-attr="kikoku"><span>帰国子女</span></label>
      <label><input type="checkbox" data-attr="taiiku"><span>体育会経験</span></label>
      <label><input type="checkbox" data-attr="ryugaku"><span>留学</span></label>
      <label><input type="checkbox" data-attr="intern"><span>長期インターン</span></label>
      <label><input type="checkbox" data-attr="volunteer"><span>ボランティア</span></label>
      <label><input type="checkbox" data-attr="zemi"><span>ゼミでの発表</span></label>
    </div>
  </div>

  <button class="primary" id="diagnose">診断する</button>

  <div id="result" class="result"></div>
</div>

<script src="data_companies.js"></script>
<script src="company_detail.js"></script>
<script>
const UNIV_TIERS = [
  { h: 75.0, univs: ["東京大学","一橋大学","京都大学","東京科学大学"] },
  { h: 72.5, univs: ["北海道大学","東京外国語大学","お茶の水女子大学","九州大学","大阪大学","東北大学","早稲田大学","慶應義塾大学","名古屋大学"] },
  { h: 70.0, univs: ["神戸大学","国際教養大学","筑波大学","海外大学"] },
  { h: 67.5, univs: ["千葉大学","東京学芸大学","上智大学","東京理科大学"] },
  { h: 65.0, univs: ["岡山大学","広島大学","横浜市立大学","明治大学","同志社大学","金沢大学"] },
  { h: 62.5, univs: ["国際基督教大学(ICU)","青山学院大学","立教大学","立命館大学","京都府立大学","東京都立大学","岐阜大学","神戸市外国語大学","大阪公立大学","横浜国立大学","名古屋市立大学","関西学院大学"] },
  { h: 60.0, univs: ["中央大学","法政大学","関西大学","学習院大学"] },
  { h: 57.5, univs: ["日本女子大学","小樽商科大学","茨城大学","高崎経済大学","都留文科大学","奈良女子大学","信州大学","静岡大学","明治学院大学","成蹊大学","成城大学","埼玉大学","大阪教育大学","宇都宮大学","電気通信大学","愛知県立大学","三重大学","滋賀大学","熊本大学"] },
  { h: 55.0, univs: ["日本大学","専修大学","工学院大学","國學院大學","東洋大学","武蔵大学","南山大学"] },
  { h: 52.5, univs: ["獨協大学","文教大学","玉川大学","中京大学","龍谷大学"] },
  { h: 50.0, univs: ["駒澤大学","昭和女子大学","東京女子大学","東京農業大学","武蔵野美術大学","甲南大学","西南学院大学"] },
  { h: 47.5, univs: ["神田外語大学","東京経済大学","神奈川大学"] },
  { h: 45.0, univs: ["帝京大学","福岡大学","拓殖大学","関東学院大学"] },
  { h: 42.5, univs: ["桜美林大学","亜細亜大学"] }
];
const UNIV_HENSACHI = {};
UNIV_TIERS.forEach(t => t.univs.forEach(u => UNIV_HENSACHI[u] = t.h));

const univInput = document.getElementById('univ');
const univSuggest = document.getElementById('univ-suggest');

univInput.addEventListener('input', () => {
  const q = univInput.value.trim();
  if (!q) { univSuggest.style.display = 'none'; return; }
  const matches = Object.keys(UNIV_HENSACHI).filter(u => u.includes(q)).slice(0, 20);
  if (!matches.length) { univSuggest.style.display = 'none'; return; }
  univSuggest.innerHTML = matches.map(u => {
    return '<div class="suggest-item" data-u="' + u + '">' + u + '<span class="hen">偏差値 ' + UNIV_HENSACHI[u].toFixed(1) + '</span></div>';
  }).join('');
  univSuggest.style.display = 'block';
  univSuggest.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      univInput.value = el.dataset.u;
      univSuggest.style.display = 'none';
    });
  });
});
document.addEventListener('click', (e) => {
  if (!univInput.contains(e.target) && !univSuggest.contains(e.target)) {
    univSuggest.style.display = 'none';
  }
});

function calcHensachi(profile) {
  const breakdown = [];
  const track = profile.track;
  const univMatch = profile.univ in UNIV_HENSACHI;
  const univHensachi = univMatch ? UNIV_HENSACHI[profile.univ] : 50;

  let score = univHensachi;
  breakdown.push({
    label: univMatch ? '大学偏差値 (' + profile.univ + ')' : '大学偏差値（該当なし→50）',
    value: score,
    type: 'base'
  });

  if (profile.edu === '修士卒' || profile.edu === '博士卒') {
    score += 2;
    breakdown.push({ label: '学歴 ' + profile.edu, value: 2, type: 'pos' });
  } else {
    const eduPenalty = { '高専卒': -1, '短大卒': -3, '専門卒': -4, '高卒': -6 };
    const d = eduPenalty[profile.edu];
    if (d) {
      score += d;
      breakdown.push({ label: '学歴 ' + profile.edu, value: d, type: 'neg' });
    }
  }

  if (track === '理系') {
    score += 2;
    breakdown.push({ label: '理系', value: 2, type: 'pos' });
  }

  if (profile.gender === '女性') {
    score += 2;
    breakdown.push({ label: '女性', value: 2, type: 'pos' });
  }

  const toeic = parseInt(profile.toeic) || 0;
  let toeicBonus = 0, toeicLabel = '';
  if (toeic >= 900) { toeicBonus = 1.0; toeicLabel = 'TOEIC 900+'; }
  else if (toeic >= 800) { toeicBonus = 0.5; toeicLabel = 'TOEIC 800+'; }
  else if (toeic >= 730) { toeicBonus = 0.2; toeicLabel = 'TOEIC 730+'; }
  if (toeicBonus > 0) {
    score += toeicBonus;
    breakdown.push({ label: toeicLabel, value: toeicBonus, type: 'pos' });
  }

  const ryunen = parseInt(profile.ryunen) || 0;
  if (ryunen > 0) {
    const d = -1 * ryunen;
    score += d;
    breakdown.push({ label: '留年 ' + ryunen + '年', value: d, type: 'neg' });
  }

  const ronin = parseInt(profile.ronin) || 0;
  if (ronin > 0) {
    const d = -0.5 * ronin;
    score += d;
    breakdown.push({ label: '浪人 ' + ronin + '年', value: d, type: 'neg' });
  }

  const attrBonus = [
    { key: 'kikoku', label: '帰国子女', v: 3 },
    { key: 'taiiku', label: '体育会経験', v: 3 },
    { key: 'ryugaku', label: '留学経験', v: 1 },
    { key: 'intern', label: '長期インターン', v: 1 },
    { key: 'volunteer', label: 'ボランティア', v: 0.5 },
    { key: 'zemi', label: 'ゼミでの発表', v: 0.5 }
  ];
  attrBonus.forEach(a => {
    if (profile.attrs[a.key]) {
      score += a.v;
      breakdown.push({ label: a.label, value: a.v, type: 'pos' });
    }
  });

  return {
    score: Math.round(score * 10) / 10,
    breakdown,
    univHensachi,
    univMatch
  };
}

function getTier(score) {
  if (score >= 78) return '最上位 (外資金融・商社トップ級)';
  if (score >= 75) return '東京一工･大勝レベル';
  if (score >= 70) return '東京一工･勝ちレベル';
  if (score >= 66) return '地帝早慶･大勝レベル';
  if (score >= 61) return 'MARCH･大勝レベル';
  if (score >= 56) return 'MARCH･勝ちレベル';
  if (score >= 50) return '日東駒専･勝ちレベル';
  return '一般層';
}

function categorize(score, companyH) {
  const diff = companyH - score;
  if (diff <= -5) return '余裕';
  if (diff <= 2) return '実力相応';
  if (diff <= 5) return '挑戦';
  return '高望み';
}

function formatCompany(name) {
  return name
    .replace(/↑/g, '<span class="arrow-up">↑</span>')
    .replace(/↓/g, '<span class="arrow-down">↓</span>');
}

function renderResult(profile, calc) {
  const result = document.getElementById('result');
  const score = calc.score;
  const tier = getTier(score);

  let html = '';
  html += '<div class="score-card">';
  html += '<div class="score-label">想定 就活偏差値</div>';
  html += '<div class="score-value">' + score.toFixed(1) + '</div>';
  html += '<div class="tier-badge">' + tier + '</div>';
  html += '<div class="breakdown">';
  calc.breakdown.forEach(b => {
    const val = b.type === 'base' ? b.value.toFixed(1) : (b.value > 0 ? '+' : '') + b.value;
    html += '<div class="breakdown-item"><span>' + b.label + '</span><span class="val ' + b.type + '">' + val + '</span></div>';
  });
  html += '</div>';
  html += '</div>';

  html += renderCTA();

  const categories = { '実力相応': [], '挑戦': [], '余裕': [], '高望み': [] };
  COMPANIES.forEach(group => {
    const cat = categorize(score, group.hensachi);
    categories[cat].push(group);
  });

  const order = [
    { key: '実力相応', note: '合格可能性が現実的なレンジ' },
    { key: '挑戦', note: '努力次第で十分狙えるレンジ' },
    { key: '余裕', note: 'スクリーニングは通過しやすいレンジ' },
    { key: '高望み', note: 'かなり難易度が高いが全く不可能ではないレンジ' }
  ];

  order.forEach(o => {
    const groups = categories[o.key];
    if (!groups.length) return;
    html += '<div class="section-title cat-' + o.key + '">' + o.key + ' <span class="cat-note">' + o.note + '</span></div>';
    const displayGroups = o.key === '余裕' ? groups.slice(0, 3) : groups;
    displayGroups.forEach(g => {
      html += '<div class="match-group">';
      html += '<div class="match-hensachi">偏差値 ' + g.hensachi + ' (' + g.companies.length + '社)</div>';
      html += '<div class="match-companies">';
      const shown = o.key === '余裕' ? g.companies.slice(0, 20) : g.companies;
      shown.forEach(c => {
        html += '<span class="chip" data-company="' + c.replace(/"/g, '&quot;') + '">' + formatCompany(c) + '</span>';
      });
      if (shown.length < g.companies.length) {
        html += '<span class="chip" style="color:#aaa;">他' + (g.companies.length - shown.length) + '社</span>';
      }
      html += '</div></div>';
    });
    if (o.key === '余裕' && groups.length > 3) {
      html += '<div style="text-align:center;color:#aaa;font-size:12px;margin-top:4px;">...さらに下位レベルあり</div>';
    }
  });

  result.innerHTML = html;
  result.querySelectorAll('.chip[data-company]').forEach(el => {
    el.addEventListener('click', () => window.showCompanyDetail(el.dataset.company));
  });
  result.classList.add('show');
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  const companies = [
    { name: 'PwC', domain: 'pwc.com' },
    { name: 'アクセンチュア', domain: 'accenture.com' },
    { name: 'Amazon', domain: 'amazon.com' },
    { name: 'Deloitte', domain: 'deloitte.com' },
    { name: 'ソフトバンク', domain: 'softbank.jp' },
    { name: 'IBM', domain: 'ibm.com' }
  ];
  let h = '<div class="cta-card">';
  h += '<div class="cta-pr">PR</div>';
  h += '<div class="cta-title">📈 就活偏差値 <span class="cta-boost">+5</span> を狙う</div>';
  h += '<div class="cta-desc">';
  h += '<strong>長期インターン × 生成AIガクチカ作り</strong>で、エントリーシート・面接で他の就活生と圧倒的な差別化を。';
  h += '実務経験と生成AI活用のストーリーは外資・コンサル・大手の選考通過率を大幅に高めます。';
  h += '</div>';
  h += '<div class="cta-logos-label">▼ 内定者輩出企業（一例）</div>';
  h += '<div class="logos-grid">';
  companies.forEach(c => {
    const src = 'https://www.google.com/s2/favicons?domain=' + c.domain + '&sz=128';
    h += '<div class="logo-item">';
    h += '<img src="' + src + '" alt="' + c.name + '" loading="lazy">';
    h += '<span>' + c.name + '</span>';
    h += '</div>';
  });
  h += '</div>';
  h += '<button class="cta-button" onclick="alert(\'こちらは表示サンプルです。実際のサービスへの導線を設定してください。\')">▶ 詳細を見る</button>';
  h += '<div class="cta-note">※ +5は目安です。個人差があります。</div>';
  h += '</div>';
  return h;
}

document.getElementById('diagnose').addEventListener('click', () => {
  const profile = {
    age: document.getElementById('age').value,
    gender: document.getElementById('gender').value,
    edu: document.getElementById('edu').value,
    track: document.getElementById('track').value,
    facultyType: document.getElementById('faculty-type').value,
    univ: document.getElementById('univ').value.trim(),
    toeic: document.getElementById('toeic').value,
    ryunen: document.getElementById('ryunen').value,
    ronin: document.getElementById('ronin').value,
    attrs: {}
  };
  document.querySelectorAll('input[data-attr]').forEach(cb => {
    profile.attrs[cb.dataset.attr] = cb.checked;
  });
  const calc = calcHensachi(profile);
  renderResult(profile, calc);
});
