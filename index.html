<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活偏差値診断">
<title>就活偏差値診断</title>
<style>
:root {
  --yt-red: #cc0000;
  --yt-red-hover: #a00000;
  --yt-text: #0f0f0f;
  --yt-text-2: #606060;
  --yt-text-3: #909090;
  --yt-bg: #ffffff;
  --yt-bg-2: #f9f9f9;
  --yt-bg-3: #f2f2f2;
  --yt-border: #e5e5e5;
  --yt-border-strong: #d3d3d3;
  --yt-blue: #065fd4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--yt-bg-2);
  min-height: 100vh;
  padding: 24px 16px;
  color: var(--yt-text);
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 820px;
  margin: 0 auto;
  background: var(--yt-bg);
  border-radius: 12px;
  border: 1px solid var(--yt-border);
  padding: 32px 36px;
}
h1 {
  text-align: left;
  color: var(--yt-text);
  margin-bottom: 4px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.subtitle {
  text-align: left;
  color: var(--yt-text-2);
  margin-bottom: 20px;
  font-size: 14px;
  font-weight: 400;
}
.nav { text-align: left; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--yt-border); }
.nav a {
  color: var(--yt-text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 8px 14px;
  background: var(--yt-bg-3);
  border: 1px solid transparent;
  border-radius: 18px;
  display: inline-block;
  transition: background 0.15s;
}
.nav a:hover { background: #e5e5e5; }
.nav a + a { margin-left: 8px; }
.form-group { margin-bottom: 18px; }
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}
label {
  display: block;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--yt-text);
  font-size: 13px;
}
select, input[type="text"], input[type="number"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--yt-border-strong);
  border-radius: 8px;
  font-size: 14px;
  background: var(--yt-bg);
  transition: border-color 0.15s, box-shadow 0.15s;
  font-family: inherit;
  color: var(--yt-text);
}
select:focus, input:focus {
  outline: none;
  border-color: var(--yt-text);
  box-shadow: 0 0 0 1px var(--yt-text);
}
.hint { font-size: 12px; color: var(--yt-text-3); margin-top: 4px; }
.suggest {
  position: relative;
  margin-top: 8px;
  max-height: 260px;
  overflow-y: auto;
  border: 2px solid var(--yt-text);
  border-radius: 14px;
  background: var(--yt-bg);
  display: none;
  z-index: 10;
  box-shadow: 0 8px 24px rgba(0,0,0,0.16);
}
.suggest-header {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--yt-text-2);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: var(--yt-bg-2);
  border-bottom: 1px solid var(--yt-border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.suggest-header::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--yt-red);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.suggest-item {
  padding: 14px 16px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: var(--yt-text);
  border-bottom: 1px solid var(--yt-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  transition: background 0.12s;
}
.suggest-item:last-child { border-bottom: none; }
.suggest-item::after {
  content: '選択 →';
  font-size: 11px;
  color: var(--yt-text-3);
  font-weight: 500;
  margin-left: auto;
  padding-left: 6px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.12s;
}
.suggest-item:hover, .suggest-item:active {
  background: linear-gradient(90deg, #fff5f5, #fff);
}
.suggest-item:hover::after { opacity: 1; }
.suggest-item .hen {
  color: #fff;
  background: linear-gradient(135deg, #ff4757, #cc0000);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 12px;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(204,0,0,0.25);
}
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.checkbox-grid label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 12px;
  background: var(--yt-bg);
  border: 1px solid var(--yt-border-strong);
  border-radius: 18px;
  cursor: pointer;
  font-weight: 500;
  font-size: 13px;
  transition: all 0.12s;
  color: var(--yt-text);
}
.checkbox-grid label:hover { background: var(--yt-bg-3); }
.checkbox-grid label:has(input:checked) {
  background: var(--yt-text);
  border-color: var(--yt-text);
  color: #fff;
}
.checkbox-grid input { margin: 0; accent-color: var(--yt-text); }
.checkbox-grid label:has(input:checked) input { display: none; }
button.primary {
  width: 100%;
  padding: 12px;
  background: var(--yt-red);
  color: #fff;
  border: none;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.15s;
  font-family: inherit;
}
button.primary:hover { background: var(--yt-red-hover); }
.result {
  margin-top: 28px;
  display: none;
}
.result.show { display: block; }
.score-card {
  padding: 36px 24px 32px;
  background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);
  border-radius: 16px;
  border: none;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(102, 51, 204, 0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
}
.score-card::before {
  content: '';
  position: absolute;
  inset: -2px;
  background: conic-gradient(from 0deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #ff006e);
  filter: blur(20px);
  opacity: 0.35;
  z-index: 0;
  animation: rotate-glow 8s linear infinite;
}
.score-card::after {
  content: '';
  position: absolute;
  inset: 2px;
  background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b4e 100%);
  border-radius: 14px;
  z-index: 1;
}
.score-card > * { position: relative; z-index: 2; }
@keyframes rotate-glow {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.score-label {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 4px;
  margin-bottom: 10px;
  font-weight: 600;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.score-label::before, .score-label::after {
  content: '';
  width: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(131,56,236,0.8));
}
.score-label::after { background: linear-gradient(90deg, rgba(131,56,236,0.8), transparent); }
.score-value {
  font-size: 84px;
  font-weight: 700;
  background: linear-gradient(135deg, #06ffa5 0%, #3a86ff 35%, #8338ec 70%, #ff006e 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  letter-spacing: -3px;
  filter: drop-shadow(0 4px 20px rgba(131,56,236,0.5));
  font-family: 'Roboto', sans-serif;
  animation: score-glow 2.5s ease-in-out infinite;
}
@keyframes score-glow {
  0%, 100% { filter: drop-shadow(0 4px 20px rgba(131,56,236,0.5)); }
  50% { filter: drop-shadow(0 4px 28px rgba(6,255,165,0.7)); }
}
.tier-badge {
  display: inline-block;
  padding: 8px 20px;
  margin-top: 16px;
  background: linear-gradient(135deg, rgba(255,0,110,0.15), rgba(131,56,236,0.15));
  border: 1px solid rgba(131,56,236,0.5);
  border-radius: 20px;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  text-shadow: 0 0 10px rgba(131,56,236,0.6);
}
.breakdown {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--yt-bg-2);
  border-radius: 12px;
  font-size: 13px;
  text-align: left;
  max-height: 220px;
  overflow-y: auto;
}
.breakdown-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--yt-border);
  color: var(--yt-text-2);
}
.breakdown-item:last-child { border-bottom: none; }
.breakdown-item .val.pos { color: #2e7d32; font-weight: 500; }
.breakdown-item .val.neg { color: var(--yt-red); font-weight: 500; }
.breakdown-item .val.base { color: var(--yt-blue); font-weight: 500; }
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--yt-text);
  margin: 24px 0 12px 0;
  padding: 0;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title .cat-note { font-size: 12px; color: var(--yt-text-2); font-weight: 400; }
.match-group {
  margin-bottom: 8px;
  padding: 12px 14px;
  background: var(--yt-bg-2);
  border-radius: 12px;
}
.match-hensachi { font-weight: 700; color: var(--yt-text); font-size: 13px; margin-bottom: 8px; }
.match-companies { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 12px;
  background: var(--yt-bg);
  border-radius: 18px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--yt-border-strong);
  cursor: pointer;
  transition: all 0.12s;
  color: var(--yt-text);
}
.chip:hover { background: var(--yt-text); color: #fff; border-color: var(--yt-text); }
.arrow-up { color: var(--yt-red); font-weight: 700; margin-left: 1px; }
.arrow-down { color: var(--yt-blue); font-weight: 700; margin-left: 1px; }
.cat-余裕 { color: #2e7d32; }
.cat-実力相応 { color: var(--yt-blue); }
.cat-挑戦 { color: #e65100; }
.cat-高望み { color: var(--yt-red); }
.cta-card {
  margin-top: 28px;
  padding: 20px;
  background: var(--yt-bg);
  border: 1px solid var(--yt-border);
  border-radius: 12px;
  position: relative;
}
.cta-pr {
  position: absolute;
  top: 12px;
  right: 16px;
  background: transparent;
  color: var(--yt-text-3);
  font-size: 11px;
  font-weight: 500;
  padding: 0;
  border-radius: 0;
  letter-spacing: 1px;
}
.cta-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--yt-text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 36px;
}
.cta-boost {
  display: inline-block;
  background: var(--yt-red);
  color: #fff;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 500;
  font-size: 13px;
}
.cta-desc {
  color: var(--yt-text-2);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 16px;
}
.cta-desc strong {
  background: transparent;
  font-weight: 700;
  padding: 0;
  color: var(--yt-text);
}
.cta-logos-label {
  font-size: 12px;
  color: var(--yt-text-2);
  margin-bottom: 10px;
  letter-spacing: 0;
  font-weight: 500;
}
.logos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  gap: 8px;
  margin-bottom: 16px;
}
.logo-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  background: var(--yt-bg-2);
  border: 1px solid var(--yt-border);
  border-radius: 12px;
  transition: background 0.15s;
}
.logo-item:hover { background: var(--yt-bg-3); }
.logo-item img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}
.logo-item span {
  font-size: 11px;
  color: var(--yt-text-2);
  font-weight: 500;
  text-align: center;
}
.cta-button {
  width: 100%;
  padding: 10px;
  background: var(--yt-red);
  color: #fff;
  border: none;
  border-radius: 18px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}
.cta-button:hover { background: var(--yt-red-hover); }
.cta-note { text-align: center; margin-top: 10px; font-size: 11px; color: var(--yt-text-3); }
@media (max-width: 600px) {
  body { padding: 0; background: var(--yt-bg); }
  .container { padding: 16px 14px 24px; margin: 0; border-radius: 0; border: none; }
  h1 { font-size: 20px; }
  .subtitle { font-size: 13px; margin-bottom: 16px; }
  .nav { margin-bottom: 18px; padding-bottom: 12px; }
  .nav a { display: inline-block; margin: 0 4px 0 0; padding: 7px 12px; font-size: 13px; }
  .nav a + a { margin-left: 4px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; gap: 12px; }
  .checkbox-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .checkbox-grid label { font-size: 13px; padding: 10px 12px; }
  select, input[type="text"], input[type="number"] { font-size: 16px; padding: 11px 12px; }
  button.primary { padding: 13px; font-size: 14px; }
  .score-card { padding: 28px 16px 24px; }
  .score-value { font-size: 64px; letter-spacing: -2px; }
  .score-label { font-size: 10px; letter-spacing: 3px; }
  .score-label::before, .score-label::after { width: 16px; }
  .tier-badge { font-size: 13px; padding: 7px 16px; margin-top: 12px; }
  .breakdown { font-size: 12px; padding: 12px; }
  .section-title { font-size: 15px; }
  .match-group { padding: 10px 12px; }
  .chip { font-size: 13px; padding: 6px 12px; min-height: 30px; display: inline-flex; align-items: center; }
  .cta-card { padding: 18px 14px; }
  .cta-title { font-size: 15px; flex-wrap: wrap; padding-right: 32px; }
  .logos-grid { grid-template-columns: repeat(3, 1fr); }
  .logo-item { padding: 10px 4px; }
  .suggest { max-height: 280px; }
  .suggest-item { padding: 14px; font-size: 15px; }
  .suggest-item .hen { font-size: 13px; padding: 5px 11px; }
}
@media (max-width: 380px) {
  .checkbox-grid { grid-template-columns: 1fr; }
  .logos-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="container">
  <h1>就活偏差値診断</h1>
  <p class="subtitle">プロフィール入力で想定就活偏差値と狙える企業が分かります</p>

  <div class="nav">
    <a href="companies.html">就活偏差値ランキング</a>
  </div>

  <div class="form-row-3">
    <div class="form-group">
      <label>年齢</label>
      <input type="number" id="age" min="18" max="60" value="22">
    </div>
    <div class="form-group">
      <label>性別（任意）</label>
      <select id="gender">
        <option value="">未回答</option>
        <option value="男性">男性</option>
        <option value="女性">女性</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="form-group">
      <label>文系 / 理系</label>
      <select id="track">
        <option value="文系">文系</option>
        <option value="理系">理系</option>
      </select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>学歴区分</label>
      <select id="edu">
        <option value="学部卒">学部卒</option>
        <option value="修士卒">修士卒</option>
        <option value="博士卒">博士卒</option>
        <option value="高専卒">高専卒</option>
        <option value="短大卒">短大卒</option>
        <option value="専門卒">専門卒</option>
        <option value="高卒">高卒</option>
      </select>
    </div>
    <div class="form-group">
      <label>学部系統</label>
      <select id="faculty-type">
        <option value="">選択してください</option>
        <option value="法学">法学</option>
        <option value="経済・経営・商">経済・経営・商</option>
        <option value="文学">文学</option>
        <option value="教育">教育</option>
        <option value="社会学">社会学</option>
        <option value="国際・外国語">国際・外国語</option>
        <option value="工学">工学</option>
        <option value="理学">理学</option>
        <option value="情報">情報</option>
        <option value="医・歯・薬">医・歯・薬</option>
        <option value="農学">農学</option>
        <option value="その他">その他</option>
      </select>
    </div>
  </div>

  <div class="form-group" style="position:relative;">
    <label>出身 / 在籍大学</label>
    <input type="text" id="univ" placeholder="例: 東京大学、早稲田、北海道..." autocomplete="off">
    <div class="hint">入力しながら一覧から選択できます。該当がない場合は偏差値50として扱います。</div>
    <div id="univ-suggest" class="suggest"></div>
  </div>

  <div class="form-row-3">
    <div class="form-group">
      <label>英語力（TOEIC目安）</label>
      <select id="toeic">
        <option value="0">未設定 / 受験なし</option>
        <option value="500">〜500</option>
        <option value="600">500〜730</option>
        <option value="730">730〜800 (+0.2)</option>
        <option value="800">800〜900 (+0.5)</option>
        <option value="900">900〜 (+1.0)</option>
      </select>
    </div>
    <div class="form-group">
      <label>留年</label>
      <select id="ryunen">
        <option value="0">なし</option>
        <option value="1">1年 (-1)</option>
        <option value="2">2年 (-2)</option>
        <option value="3">3年以上 (-3)</option>
      </select>
    </div>
    <div class="form-group">
      <label>浪人</label>
      <select id="ronin">
        <option value="0">現役</option>
        <option value="1">1浪 (-0.5)</option>
        <option value="2">2浪 (-1.0)</option>
        <option value="3">3浪以上 (-1.5)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>属性（複数選択可）</label>
    <div class="checkbox-grid">
      <label><input type="checkbox" data-attr="kikoku"><span>帰国子女</span></label>
      <label><input type="checkbox" data-attr="taiiku"><span>体育会経験</span></label>
      <label><input type="checkbox" data-attr="ryugaku"><span>留学</span></label>
      <label><input type="checkbox" data-attr="intern"><span>長期インターン</span></label>
      <label><input type="checkbox" data-attr="volunteer"><span>ボランティア</span></label>
      <label><input type="checkbox" data-attr="zemi"><span>ゼミでの発表</span></label>
    </div>
  </div>

  <button class="primary" id="diagnose">診断する</button>

  <div id="result" class="result"></div>
</div>

<script src="data_companies.js"></script>
<script src="company_detail.js"></script>
<script>
const UNIV_TIERS = [
  { h: 75.0, univs: ["東京大学","一橋大学","京都大学","東京科学大学"] },
  { h: 72.5, univs: ["北海道大学","東京外国語大学","お茶の水女子大学","九州大学","大阪大学","東北大学","早稲田大学","慶應義塾大学","名古屋大学"] },
  { h: 70.0, univs: ["神戸大学","国際教養大学","筑波大学","海外大学"] },
  { h: 67.5, univs: ["千葉大学","東京学芸大学","上智大学","東京理科大学"] },
  { h: 65.0, univs: ["岡山大学","広島大学","横浜市立大学","明治大学","同志社大学","金沢大学"] },

const UNIV_HENSACHI = {};
UNIV_TIERS.forEach(t => t.univs.forEach(u => UNIV_HENSACHI[u] = t.h));

const univInput = document.getElementById('univ');
const univSuggest = document.getElementById('univ-suggest');

univInput.addEventListener('input', () => {
  const q = univInput.value.trim();
  if (!q) { univSuggest.style.display = 'none'; return; }
  const matches = Object.keys(UNIV_HENSACHI).filter(u => u.includes(q)).slice(0, 20);
  if (!matches.length) { univSuggest.style.display = 'none'; return; }
  const header = '<div class="suggest-header">候補から選択（' + matches.length + '件）</div>';
  univSuggest.innerHTML = header + matches.map(u => {
    return '<div class="suggest-item" data-u="' + u + '">' + u + '<span class="hen">偏差値 ' + UNIV_HENSACHI[u].toFixed(1) + '</span></div>';
  }).join('');
  univSuggest.style.display = 'block';
  univSuggest.querySelectorAll('.suggest-item').forEach(el => {
    el.addEventListener('click', () => {
      univInput.value = el.dataset.u;
      univSuggest.style.display = 'none';
    });
  });
});
document.addEventListener('click', (e) => {
  if (!univInput.contains(e.target) && !univSuggest.contains(e.target)) {
    univSuggest.style.display = 'none';
  }
});

function calcHensachi(profile) {
  const breakdown = [];
  const track = profile.track;
  const univMatch = profile.univ in UNIV_HENSACHI;
  const univHensachi = univMatch ? UNIV_HENSACHI[profile.univ] : 50;

  let score = univHensachi;
  breakdown.push({
    label: univMatch ? '大学偏差値 (' + profile.univ + ')' : '大学偏差値（該当なし→50）',
    value: score,
    type: 'base'
  });

  if (profile.edu === '修士卒' || profile.edu === '博士卒') {
    score += 2;
    breakdown.push({ label: '学歴 ' + profile.edu, value: 2, type: 'pos' });
  } else {
    const eduPenalty = { '高専卒': -1, '短大卒': -3, '専門卒': -4, '高卒': -6 };
    const d = eduPenalty[profile.edu];
    if (d) {
      score += d;
      breakdown.push({ label: '学歴 ' + profile.edu, value: d, type: 'neg' });
    }
  }

  if (track === '理系') {
    score += 2;
    breakdown.push({ label: '理系', value: 2, type: 'pos' });
  }

  if (profile.gender === '女性') {
    score += 2;
    breakdown.push({ label: '女性', value: 2, type: 'pos' });
  }

  const toeic = parseInt(profile.toeic) || 0;
  let toeicBonus = 0, toeicLabel = '';
  if (toeic >= 900) { toeicBonus = 1.0; toeicLabel = 'TOEIC 900+'; }
  else if (toeic >= 800) { toeicBonus = 0.5; toeicLabel = 'TOEIC 800+'; }
  else if (toeic >= 730) { toeicBonus = 0.2; toeicLabel = 'TOEIC 730+'; }
  if (toeicBonus > 0) {
    score += toeicBonus;
    breakdown.push({ label: toeicLabel, value: toeicBonus, type: 'pos' });
  }

  const ryunen = parseInt(profile.ryunen) || 0;
  if (ryunen > 0) {
    const d = -1 * ryunen;
    score += d;
    breakdown.push({ label: '留年 ' + ryunen + '年', value: d, type: 'neg' });
  }

  const ronin = parseInt(profile.ronin) || 0;
  if (ronin > 0) {
    const d = -0.5 * ronin;
    score += d;
    breakdown.push({ label: '浪人 ' + ronin + '年', value: d, type: 'neg' });
  }

  const attrBonus = [
    { key: 'kikoku', label: '帰国子女', v: 3 },
    { key: 'taiiku', label: '体育会経験', v: 3 },
    { key: 'ryugaku', label: '留学経験', v: 1 },
    { key: 'intern', label: '長期インターン', v: 1 },
    { key: 'volunteer', label: 'ボランティア', v: 0.5 },
    { key: 'zemi', label: 'ゼミでの発表', v: 0.5 }
  ];
  attrBonus.forEach(a => {
    if (profile.attrs[a.key]) {
      score += a.v;
      breakdown.push({ label: a.label, value: a.v, type: 'pos' });
    }
  });

  return {
    score: Math.round(score * 10) / 10,
    breakdown,
    univHensachi,
    univMatch
  };
}

function getTier(score) {
  if (score >= 78) return '最上位 (外資金融・商社トップ級)';
  if (score >= 75) return '東京一工･大勝レベル';
  if (score >= 70) return '東京一工･勝ちレベル';
  if (score >= 66) return '地帝早慶･大勝レベル';
  if (score >= 61) return 'MARCH･大勝レベル';
  if (score >= 56) return 'MARCH･勝ちレベル';
  if (score >= 50) return '日東駒専･勝ちレベル';
  return '一般層';
}

function categorize(score, companyH) {
  const diff = companyH - score;
  if (diff <= -5) return '余裕';
  if (diff <= 2) return '実力相応';
  if (diff <= 5) return '挑戦';
  return '高望み';
}

function formatCompany(name) {
  return name
    .replace(/↑/g, '<span class="arrow-up">↑</span>')
    .replace(/↓/g, '<span class="arrow-down">↓</span>');
}

function renderResult(profile, calc) {
  const result = document.getElementById('result');
  const score = calc.score;
  const tier = getTier(score);

  let html = '';
  html += '<div class="score-card">';
  html += '<div class="score-label">想定 就活偏差値</div>';
  html += '<div class="score-value">' + score.toFixed(1) + '</div>';
  html += '<div class="tier-badge">' + tier + '</div>';
  html += '<div class="breakdown">';
  calc.breakdown.forEach(b => {
    const val = b.type === 'base' ? b.value.toFixed(1) : (b.value > 0 ? '+' : '') + b.value;
    html += '<div class="breakdown-item"><span>' + b.label + '</span><span class="val ' + b.type + '">' + val + '</span></div>';
  });
  html += '</div>';
  html += '</div>';

  html += renderCTA();

  const categories = { '実力相応': [], '挑戦': [], '余裕': [], '高望み': [] };
  COMPANIES.forEach(group => {
    const cat = categorize(score, group.hensachi);
    categories[cat].push(group);
  });

  const order = [
    { key: '実力相応', note: '合格可能性が現実的なレンジ' },
    { key: '挑戦', note: '努力次第で十分狙えるレンジ' },
    { key: '余裕', note: 'スクリーニングは通過しやすいレンジ' },
    { key: '高望み', note: 'かなり難易度が高いが全く不可能ではないレンジ' }
  ];

  order.forEach(o => {
    const groups = categories[o.key];
    if (!groups.length) return;
    html += '<div class="section-title cat-' + o.key + '">' + o.key + ' <span class="cat-note">' + o.note + '</span></div>';
    const displayGroups = o.key === '余裕' ? groups.slice(0, 3) : groups;
    displayGroups.forEach(g => {
      html += '<div class="match-group">';
      html += '<div class="match-hensachi">偏差値 ' + g.hensachi + ' (' + g.companies.length + '社)</div>';
      html += '<div class="match-companies">';
      const shown = o.key === '余裕' ? g.companies.slice(0, 20) : g.companies;
      shown.forEach(c => {
        html += '<span class="chip" data-company="' + c.replace(/"/g, '&quot;') + '">' + formatCompany(c) + '</span>';
      });
      if (shown.length < g.companies.length) {
        html += '<span class="chip" style="color:#aaa;">他' + (g.companies.length - shown.length) + '社</span>';
      }
      html += '</div></div>';
    });
    if (o.key === '余裕' && groups.length > 3) {
      html += '<div style="text-align:center;color:#aaa;font-size:12px;margin-top:4px;">...さらに下位レベルあり</div>';
    }
  });

  result.innerHTML = html;
  result.querySelectorAll('.chip[data-company]').forEach(el => {
    el.addEventListener('click', () => window.showCompanyDetail(el.dataset.company));
  });
  result.classList.add('show');
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  h += '<div class="cta-desc">';

  h += '実務経験と生成AI活用のストーリーは外資・コンサル・大手の選考通過率を大幅に高めます。';
  h += '</div>';

  h += '<div class="logos-grid">';
  companies.forEach(c => {
    const src = 'https://www.google.com/s2/favicons?domain=' + c.domain + '&sz=128';
    h += '<div class="logo-item">';
    h += '<img src="' + src + '" alt="' + c.name + '" loading="lazy">';
    h += '<span>' + c.name + '</span>';
    h += '</div>';
  });
  h += '</div>';
  h += '<button class="cta-button" onclick="alert(\'現在準備中です\')">▶ 詳細を見る</button>';
  h += '<div class="cta-note">※ +5は目安です。個人差があります。</div>';

  return h;
}

document.getElementById('diagnose').addEventListener('click', () => {
  const profile = {
    age: document.getElementById('age').value,
    gender: document.getElementById('gender').value,
    edu: document.getElementById('edu').value,
    track: document.getElementById('track').value,
    facultyType: document.getElementById('faculty-type').value,
    univ: document.getElementById('univ').value.trim(),
    toeic: document.getElementById('toeic').value,
    ryunen: document.getElementById('ryunen').value,
    ronin: document.getElementById('ronin').value,
    attrs: {}
  };
  document.querySelectorAll('input[data-attr]').forEach(cb => {
    profile.attrs[cb.dataset.attr] = cb.checked;
  });
  const calc = calcHensachi(profile);
  renderResult(profile, calc);
});
