<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活偏差値">
<title>就活偏差値ランキング</title>
<style>
:root {
  --yt-red: #cc0000;
  --yt-text: #0f0f0f;
  --yt-text-2: #606060;
  --yt-text-3: #909090;
  --yt-bg: #ffffff;
  --yt-bg-2: #f9f9f9;
  --yt-bg-3: #f2f2f2;
  --yt-border: #e5e5e5;
  --yt-border-strong: #d3d3d3;
  --yt-blue: #065fd4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Roboto', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--yt-bg-2);
  min-height: 100vh;
  padding: 24px 16px;
  color: var(--yt-text);
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 960px;
  margin: 0 auto;
  background: var(--yt-bg);
  border-radius: 12px;
  border: 1px solid var(--yt-border);
  padding: 32px 36px;
}
h1 {
  text-align: left;
  color: var(--yt-text);
  margin-bottom: 4px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.subtitle {
  text-align: left;
  color: var(--yt-text-2);
  margin-bottom: 20px;
  font-size: 14px;
}
.search-box {
  margin-bottom: 16px;
  position: sticky;
  top: 0;
  padding-top: 10px;
  padding-bottom: 10px;
  background: var(--yt-bg);
  z-index: 20;
}
input[type="text"] {
  width: 100%;
  padding: 11px 16px;
  border: 1px solid var(--yt-border-strong);
  border-radius: 20px;
  font-size: 14px;
  background: var(--yt-bg);
  transition: border-color 0.15s, box-shadow 0.15s;
  font-family: inherit;
  color: var(--yt-text);
}
input[type="text"]:focus {
  outline: none;
  border-color: var(--yt-text);
  box-shadow: 0 0 0 1px var(--yt-text);
}
.tier-marker {
  margin: 28px 0 12px 0;
  text-align: left;
  font-weight: 700;
  color: var(--yt-text);
  font-size: 13px;
  letter-spacing: 2px;
  padding: 8px 0;
  background: transparent;
  border-radius: 0;
  border-bottom: 1px solid var(--yt-border);
}
.hensachi-group {
  margin-bottom: 12px;
  padding: 14px 16px;
  background: var(--yt-bg-2);
  border-radius: 12px;
  border-left: none;
}
.hensachi-label {
  font-size: 20px;
  font-weight: 700;
  color: var(--yt-text);
  margin-bottom: 10px;
  display: inline-block;
}
.count-label {
  color: var(--yt-text-3);
  font-size: 12px;
  margin-left: 8px;
  font-weight: 400;
}
.companies { display: flex; flex-wrap: wrap; gap: 6px; }
.company {
  padding: 5px 12px;
  background: var(--yt-bg);
  border-radius: 18px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--yt-border-strong);
  color: var(--yt-text);
  transition: all 0.12s;
  cursor: pointer;
}
.company:hover { background: var(--yt-text); color: #fff; border-color: var(--yt-text); }
.company.highlight {
  background: var(--yt-text);
  border-color: var(--yt-text);
  color: #fff;
  font-weight: 600;
}
.company.dim { opacity: 0.3; }
.arrow-up { color: var(--yt-red); font-weight: 700; margin-left: 1px; }
.arrow-down { color: var(--yt-blue); font-weight: 700; margin-left: 1px; }
.stats {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--yt-border);
  text-align: center;
  color: var(--yt-text-3);
  font-size: 12px;
}
.nav {
  text-align: left;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--yt-border);
}
.nav a {
  color: var(--yt-text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 8px 14px;
  background: var(--yt-bg-3);
  border: 1px solid transparent;
  border-radius: 18px;
  display: inline-block;
  transition: background 0.15s;
}
.nav a:hover { background: #e5e5e5; }
.nav a + a { margin-left: 8px; }
@media (max-width: 600px) {
  body { padding: 0; background: var(--yt-bg); }
  .container { padding: 16px 14px 24px; margin: 0; border-radius: 0; border: none; }
  h1 { font-size: 20px; }
  .subtitle { font-size: 13px; margin-bottom: 16px; }
  .nav { margin-bottom: 18px; padding-bottom: 12px; }
  .nav a { display: inline-block; margin: 0 4px 0 0; padding: 7px 12px; font-size: 13px; }
  .nav a + a { margin-left: 4px; }
  input[type="text"] { font-size: 16px; padding: 11px 16px; }
  .hensachi-group { padding: 12px 14px; }
  .hensachi-label { font-size: 18px; }
  .tier-marker { font-size: 12px; letter-spacing: 1px; padding: 6px 0; }
  .company { font-size: 13px; padding: 6px 12px; min-height: 32px; display: inline-flex; align-items: center; }
  .companies { gap: 6px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>就活偏差値ランキング</h1>
  <p class="subtitle">企業名で検索、または偏差値順に閲覧できます</p>

  <div class="nav">
    <a href="index.html">就活偏差値診断</a>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="企業名で検索（例: 三菱、トヨタ、NTT、コンサル...）" autocomplete="off">
  </div>

  <div id="content"></div>
  <p class="stats" id="stats"></p>
</div>

<script src="data_companies.js"></script>
<script src="company_detail.js"></script>
<script>
function formatCompany(name) {
  return name
    .replace(/↑/g, '<span class="arrow-up">↑</span>')
    .replace(/↓/g, '<span class="arrow-down">↓</span>');
}

function render(query) {
  const content = document.getElementById('content');
  content.innerHTML = '';
  const q = (query || '').trim().toLowerCase();
  let matchCount = 0;

  COMPANIES.forEach(group => {
    if (COMPANY_TIER_MARKERS[group.hensachi]) {
      const marker = document.createElement('div');
      marker.className = 'tier-marker';
      marker.textContent = '━ ' + COMPANY_TIER_MARKERS[group.hensachi] + ' ━';
      content.appendChild(marker);
    }

    const groupEl = document.createElement('div');
    groupEl.className = 'hensachi-group';

    const header = document.createElement('div');
    const label = document.createElement('span');
    label.className = 'hensachi-label';
    label.textContent = '【' + group.hensachi + '】';
    header.appendChild(label);
    const count = document.createElement('span');
    count.className = 'count-label';
    count.textContent = group.companies.length + '社';
    header.appendChild(count);
    groupEl.appendChild(header);

    const companiesEl = document.createElement('div');
    companiesEl.className = 'companies';

    group.companies.forEach(c => {
      const span = document.createElement('span');
      span.className = 'company';
      span.innerHTML = formatCompany(c);
      span.addEventListener('click', () => window.showCompanyDetail(c));
      if (q) {
        if (c.toLowerCase().includes(q)) {
          span.classList.add('highlight');
          matchCount++;
        } else {
          span.classList.add('dim');
        }
      }
      companiesEl.appendChild(span);
    });

    groupEl.appendChild(companiesEl);
    content.appendChild(groupEl);
  });

  const totalCount = COMPANIES.reduce((sum, g) => sum + g.companies.length, 0);
  const statsEl = document.getElementById('stats');
  if (q) {
    statsEl.textContent = '検索: "' + query + '" / ' + matchCount + '件ヒット / 全' + totalCount + '社';
  } else {
    statsEl.textContent = '収録: ' + totalCount + '社 / 偏差値50〜80 / ↑↓は前回ランキングからの変動';
  }
}

render();
document.getElementById('search').addEventListener('input', (e) => {
  render(e.target.value);
});
</script>
</body>
</html>
